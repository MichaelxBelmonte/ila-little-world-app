<body>
  <main id="gameboy" class="gb-console" aria-label="La console di Ilaria">
    <div class="gb-screen-frame">
      <div class="gb-screen-top" aria-hidden="true"><i></i><span>IL PICCOLO MONDO DI ILA</span><i></i></div>
      <div class="gb-screen-well"><canvas id="game-screen" width="240" height="160" tabindex="0" aria-label="Gioco. Frecce o WASD per camminare, Z o spazio per parlare, X per tornare, Invio per il menu.">Il gioco richiede un browser con Canvas e JavaScript.</canvas></div>
      <div class="gb-screen-bottom" aria-hidden="true"><span class="gb-power"></span><span>WITH LOVE</span><span>♡</span></div>
    </div>
    <div class="gb-brand" aria-hidden="true">Ila<span>boy</span> <small>♡</small></div>
    <div class="gb-controls">
      <div class="gb-dpad" role="group" aria-label="Direzioni">
        <button class="gb-direction gb-up" type="button" data-key="up" aria-label="Vai su">▲</button>
        <button class="gb-direction gb-left" type="button" data-key="left" aria-label="Vai a sinistra">◀</button>
        <span class="gb-dpad-center" aria-hidden="true"></span>
        <button class="gb-direction gb-right" type="button" data-key="right" aria-label="Vai a destra">▶</button>
        <button class="gb-direction gb-down" type="button" data-key="down" aria-label="Vai giù">▼</button>
      </div>
      <div class="gb-actions" role="group" aria-label="Azioni">
        <button class="gb-round gb-b" type="button" data-key="b" aria-label="B: indietro">B</button>
        <button class="gb-round gb-a" type="button" data-key="a" aria-label="A: interagisci">A</button>
      </div>
    </div>
    <div class="gb-footer"><button class="gb-start" type="button" data-key="start" aria-label="START: menu">START</button><div class="gb-speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
  </main>

    await import('./src/bundle/main.js');
